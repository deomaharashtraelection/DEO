<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>निवडणूक विभाग - डाटा एन्ट्री ऑपरेटर संघटना</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans Devanagari", "Mangal", Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    /* ===== HEADER ===== */
    .site-header {
      width: 100%;
      background: linear-gradient(135deg, #17365d, #245b8f);
      color: #fff;
      padding: 18px 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,.15);
    }

    .header-container {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Logo Placeholder */
    .logo-placeholder {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #fff;
      color: #17365d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
      border: 3px solid rgba(255,255,255,.75);
    }

    .brand-text {
      line-height: 1.2;
    }

    .main-title {
      margin: 0;
      font-size: 31px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    .sub-title {
      margin: 4px 0 0;
      font-size: 21px;
      font-weight: 500;
    }

    .english-subtitle {
      margin: 8px 0 0;
      font-size: 13px;
      opacity: .9;
      letter-spacing: .2px;
    }

    .header-badge {
      background: rgba(255,255,255,.13);
      border: 1px solid rgba(255,255,255,.3);
      padding: 10px 15px;
      border-radius: 8px;
      text-align: center;
      white-space: nowrap;
      font-size: 14px;
    }

    /* ===== NAVIGATION ===== */
    .navbar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
    }

    .nav-container {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }

    .nav-container a {
      color: #17365d;
      text-decoration: none;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 700;
      transition: background .2s;
    }

    .nav-container a:hover {
      background: #eef4f9;
    }

    /* ===== MOBILE RESPONSIVE ===== */
    @media (max-width: 700px) {
      .site-header {
        padding: 16px 12px;
      }

      .header-container {
        flex-direction: column;
        text-align: center;
      }

      .brand {
        flex-direction: column;
        gap: 10px;
      }

      .logo-placeholder {
        width: 64px;
        height: 64px;
        font-size: 28px;
      }

      .main-title {
        font-size: 23px;
      }

      .sub-title {
        font-size: 18px;
      }

      .english-subtitle {
        font-size: 12px;
      }

      .header-badge {
        width: 100%;
        white-space: normal;
      }

      .nav-container {
        flex-direction: column;
      }

      .nav-container a {
        width: 100%;
        text-align: center;
        border-bottom: 1px solid #f0f0f0;
      }
    }
  </style>
</head>

<body>

  <!-- ===== ORGANIZATION HEADER ===== -->
  <header class="site-header">
    <div class="header-container">

      <div class="brand">

        <!-- Logo Placeholder: येथे संघटनेचा वास्तविक Logo लावता येईल -->
        <div class="logo-placeholder" aria-label="संघटनेचे Logo">
          🗳️
        </div>

        <div class="brand-text">
          <!-- मोठे अक्षर -->
          <h1 class="main-title">निवडणूक विभाग</h1>

          <!-- खाली लहान अक्षर -->
          <div class="sub-title">डाटा एन्ट्री ऑपरेटर संघटना</div>

          <!-- English Subtitle -->
          <div class="english-subtitle">
            Election Department Data Entry Operators Association
          </div>
        </div>

      </div>

      <div class="header-badge">
        महाराष्ट्र राज्य<br>
        <strong>ऑनलाईन माहिती प्रणाली</strong>
      </div>

    </div>
  </header>

  <!-- ===== MENU ===== -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="#">मुख्यपृष्ठ</a>
      <a href="#">अर्ज</a>
      <a href="#">माहिती अपडेट</a>
      <a href="#">अर्जाची स्थिती</a>
      <a href="#">Login</a>
      <a href="#">Admin</a>
    </div>
  </nav>

</body>
</html>
